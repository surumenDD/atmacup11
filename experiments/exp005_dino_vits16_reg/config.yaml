# experiments/exp005_dino_vits16_reg/config.yaml
defaults:
  - _self_
  - env: default
  - exp: default
  # hydra の自動ログディレクトリ作成を無効化
  - override hydra/job_logging: none

hydra:
  output_subdir: null
  job:
    chdir: False
  run:
    dir: .

env:
  # EnvConfig のデフォルトを上書きしたい場合はここに書く
  input_dir: "./input"
  output_dir: "./output"
  exp_output_dir: "./output/experiments"

exp:
  debug: false
  seed: 42
  learning_rate: 1e-4
  batch_size: 64
  epochs: 450
  img_size: 224
  num_workers: 4
  weight_decay: 0.0
  folds: [0, 1, 2, 3, 4]


  dino_repo_dir: ./external/dino
  dino_checkpoint_path: ./output/dino/vit_small_ep800/checkpoint.pth
  dino_checkpoint_key: teacher
  dino_patch_size: 16
  dino_embed_dim_small: 384
  dino_embed_dim_base: 768

  mean_std_sample_limit: null

  use_ema: true
  ema_decay: 0.999